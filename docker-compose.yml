version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: reroute-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: reroute_db
      MYSQL_USER: reroute
      MYSQL_PASSWORD: reroute1234
    ports:
      - "3306:3306"
    volumes:
      - reroute_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

volumes:
  reroute_mysql_data:
