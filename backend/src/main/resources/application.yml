spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: local
  application:
    name: reroute

server:
  port: 8090

jwt:
  secret: reroute-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  expiration: 86400000
  refresh-expiration: 1209600000

llm:
  provider: ${LLM_PROVIDER:gemini}
  fallback-enabled: ${LLM_FALLBACK_ENABLED:true}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  timeout-millis: ${GEMINI_TIMEOUT_MILLIS:30000}
  fallback-enabled: ${GEMINI_FALLBACK_ENABLED:true}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  timeout-millis: ${OPENAI_TIMEOUT_MILLIS:30000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.reroute: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
